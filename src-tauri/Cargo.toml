[package]
name = "renpy-node-editor"
version = "0.3.0"
description = "Visual node editor that exports Ren'Py projects"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
