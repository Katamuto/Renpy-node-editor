name: Desktop releases
on:
  push: { tags: ['v*'] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest,   args: '--target aarch64-apple-darwin' }
          - { platform: macos-13,       args: '--target x86_64-apple-darwin' }
          - { platform: ubuntu-22.04,   args: '' }
          - { platform: windows-latest, args: '' }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: node tools/test-all.js
      - run: npm install
      - run: npx tauri icon app-icon.png     # generates src-tauri/icons/* for every platform
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ren'Py Node Editor ${{ github.ref_name }}"
          releaseBody: "Desktop builds: Windows (.msi/.exe), macOS (.dmg), Linux (.AppImage/.deb)."
          releaseDraft: true
          args: ${{ matrix.args }}
